<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Funny Prank 😄</title>
<style>
body{font-family:Arial;text-align:center;background:#111;color:#fff;padding:50px}
button{font-size:20px;padding:14px 24px;border:0;border-radius:12px;margin:10px}
#stop{background:#e33;color:#fff} #start{background:#2ecc71;color:#fff}
</style>
</head>
<body>
<h1>😂 Surprise!</h1>
<p>Button dabao...</p>
<button id="start">START PRANK</button>
<button id="stop">STOP</button>
<script>
let ctx, timer, playing=false;
function beep(){
  if(!ctx || !playing) return;
  const o=ctx.createOscillator(), g=ctx.createGain();
  o.frequency.value=300+Math.random()*900;
  g.gain.value=.08;
  o.connect(g);g.connect(ctx.destination);
  o.start();o.stop(ctx.currentTime+.12);
}
document.getElementById('start').onclick=()=>{
  ctx=new (window.AudioContext||window.webkitAudioContext)();
  playing=true; beep();
  timer=setInterval(beep,220);
  setTimeout(()=>document.getElementById('stop').click(),7000);
};
document.getElementById('stop').onclick=()=>{
  playing=false; clearInterval(timer);
  if(ctx) ctx.close();
};
</script>
</body>
</html>
